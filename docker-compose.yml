services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: pixely_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - pixely

  nginx:
    image: nginx:alpine
    container_name: pixely_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - pixely

  mysql:
    image: mysql:8.0
    container_name: pixely_mysql
    restart: always
    environment:
      MYSQL_DATABASE: pixely
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: pixely
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - pixely

  redis:
    image: redis:alpine
    container_name: pixely_redis
    ports:
      - "6379:6379"
    networks:
      - pixely

networks:
  pixely:

volumes:
  mysql_data: