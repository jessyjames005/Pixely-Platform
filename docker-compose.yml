services:

  # PHP-FPM application container.
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: pixely_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - pixely

  # Nginx web server.
  nginx:
    image: nginx:alpine
    container_name: pixely_nginx
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - pixely

  # Node.js development and frontend tooling container.
  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: pixely_node
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - node_modules:/var/www/node_modules
    ports:
      - "5173:5173"
      - "8081:8081"
    networks:
      - pixely

  # MySQL database.
  mysql:
    image: mysql:8.0
    container_name: pixely_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pixely
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: pixely
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - pixely

  # Redis cache / queue service.
  redis:
    image: redis:alpine
    container_name: pixely_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - pixely

networks:
  pixely:

volumes:
  mysql_data:
  node_modules:
