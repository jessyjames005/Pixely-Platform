services:

  # PHP-FPM application container.
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: pixely_app
    working_dir: /var/www
    environment:
      DEBUGBAR_ENABLED: "false"
      SANCTUM_STATEFUL_DOMAINS: "localhost,localhost:3000,127.0.0.1,127.0.0.1:8000,::1,nginx,nginx:80"
      SESSION_DOMAIN: "null"
    volumes:
      - ./:/var/www
    networks:
      - pixely

  # Nginx web server.
  nginx:
    image: nginx:alpine
    container_name: pixely_nginx
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - pixely

  # Node.js development and frontend tooling container.
  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: pixely_node
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - node_modules:/var/www/node_modules
    ports:
      - "5173:5173"
      - "8081:8081"
    networks:
      - pixely

  # One-shot Playwright runner (opt in with --profile e2e).
  e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /var/www
    command: ["bash", "-lc", "npm ci && npm run build && npm run test:e2e"]
    profiles:
      - e2e
    depends_on:
      - nginx
      - mysql
      - redis
    volumes:
      - ./:/var/www
      - e2e_node_modules:/var/www/node_modules
    networks:
      - pixely

  # MySQL database.
  mysql:
    image: mysql:8.0
    container_name: pixely_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pixely
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: pixely
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - pixely

  # Redis cache / queue service.
  redis:
    image: redis:alpine
    container_name: pixely_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - pixely

networks:
  pixely:

volumes:
  e2e_node_modules:
  mysql_data:
  node_modules:
