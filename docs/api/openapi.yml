openapi: 3.1.0
info:
  title: Laravel
  version: 0.0.1
servers:
  -
    url: 'http://localhost:8080/api/v1'
tags:
  -
    name: Gallery
  -
    name: Authentication
  -
    name: Files
  -
    name: Users
  -
    name: 'Settings & Localization'
  -
    name: 'System Tooling'
  -
    name: CinemaMovie
  -
    name: Tuleap
paths:
  /photos/upload:
    post:
      operationId: gallery.upload
      summary: 'Upload a new gallery photo; media is delegated to the Files extension'
      tags:
        - Gallery
      requestBody:
        required: true
        content:
          multipart/form-data: { schema: { type: object, properties: { title: { type: string, minLength: 1, maxLength: 255 }, image: { type: string, format: binary, contentMediaType: application/octet-stream } }, required: [title, image] } }
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        422:
          $ref: '#/components/responses/ValidationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
  /auth/login:
    post:
      operationId: auth.login
      summary: 'Authenticate a user and start a session'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/vnd.api+json: { schema: { type: object, properties: { email: { type: string, format: email }, password: { type: string } }, required: [email, password] } }
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        422:
          $ref: '#/components/responses/ValidationException'
  /auth/logout:
    post:
      operationId: auth.logout
      summary: 'Log the current user out and invalidate the session'
      tags:
        - Authentication
      responses:
        204:
          description: 'No content'
        401:
          $ref: '#/components/responses/AuthenticationException'
  /auth/me:
    get:
      operationId: auth.me
      summary: 'Return the currently authenticated user'
      tags:
        - Authentication
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        401:
          $ref: '#/components/responses/AuthenticationException'
  '/translation-catalogs/{translation_catalog}':
    get:
      operationId: v1.translation-catalogs.show
      tags:
        - Authentication
      parameters:
        -
          name: translation_catalog
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
  /files:
    post:
      operationId: file.upload
      summary: 'Upload a new file'
      tags:
        - Files
      requestBody:
        required: true
        content:
          multipart/form-data: { schema: { type: object, properties: { file: { type: string, format: binary, contentMediaType: application/octet-stream } }, required: [file] } }
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        422:
          $ref: '#/components/responses/ValidationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
    get:
      operationId: v1.files.index
      description: 'List files'
      summary: 'List files'
      tags:
        - File
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: object } } }
        401:
          $ref: '#/components/responses/AuthenticationException'
  /profile:
    get:
      operationId: profile.show
      summary: "Display the current user's own profile"
      tags:
        - Users
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        401:
          $ref: '#/components/responses/AuthenticationException'
    put:
      operationId: profile.update
      summary: "Update the current user's own profile fields"
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/vnd.api+json: { schema: { type: object, properties: { data: { type: object, properties: { type: { type: string, enum: [users] }, id: { type: string }, attributes: { type: object, properties: { name: { type: string, maxLength: 255 }, bio: { type: [string, 'null'], maxLength: 1000 }, timezone: { type: string } }, required: [name, bio, timezone] } }, required: [type, attributes] } }, required: [data] } }
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        422:
          $ref: '#/components/responses/ValidationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
  /profile/avatar:
    post:
      operationId: profile.uploadAvatar
      summary: "Upload (or replace) the current user's own avatar"
      tags:
        - Users
      requestBody:
        required: true
        content:
          multipart/form-data: { schema: { type: object, properties: { avatar: { type: string, format: binary, contentMediaType: application/octet-stream } }, required: [avatar] } }
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        422:
          $ref: '#/components/responses/ValidationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
  /locales:
    get:
      operationId: v1.locales.index
      tags:
        - 'Settings & Localization'
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
  '/platform-settings/{platform_setting}':
    get:
      operationId: v1.platform-settings.show
      summary: 'Display the current platform settings'
      tags:
        - 'Settings & Localization'
      parameters:
        -
          name: platform_setting
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
    patch:
      operationId: v1.platform-settings.update
      description: "Provided keys are merged into the existing settings;\nomitted keys are left untouched."
      summary: 'Update the platform settings'
      tags:
        - 'Settings & Localization'
      parameters:
        -
          name: platform_setting
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/vnd.api+json: { schema: { $ref: '#/components/schemas/PlatformSettingRequest' } }
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
  '/user-settings/{user_setting}':
    get:
      operationId: v1.user-settings.show
      summary: "Display the current user's settings"
      tags:
        - 'Settings & Localization'
      parameters:
        -
          name: user_setting
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
    patch:
      operationId: v1.user-settings.update
      summary: "Update the current user's settings"
      tags:
        - 'Settings & Localization'
      parameters:
        -
          name: user_setting
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/vnd.api+json: { schema: { $ref: '#/components/schemas/UserSettingRequest' } }
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
  /extensions:
    get:
      operationId: extension.index
      summary: 'List all registered extensions with their current state'
      tags:
        - 'System Tooling'
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        401:
          $ref: '#/components/responses/AuthenticationException'
  '/extensions/{id}':
    get:
      operationId: extension.show
      summary: "Display a single extension's details"
      tags:
        - 'System Tooling'
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        401:
          $ref: '#/components/responses/AuthenticationException'
    delete:
      operationId: extensionInstall.destroy
      description: "Does not drop database tables or roll back migrations — see\nExtensionInstaller::uninstall() docblock."
      summary: 'Uninstall an extension: removes its files from disk'
      tags:
        - 'System Tooling'
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        204:
          description: 'No content'
        401:
          $ref: '#/components/responses/AuthenticationException'
  '/extensions/{id}/config':
    get:
      operationId: extension.showConfig
      summary: "Display an extension's configuration: its declared defaults (if\nany) alongside the current effective values (defaults merged with\nany stored overrides) — enough for the frontend to render a form\nwithout needing to already know the extension's config shape"
      tags:
        - 'System Tooling'
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        401:
          $ref: '#/components/responses/AuthenticationException'
    put:
      operationId: extension.updateConfig
      summary: "Update an extension's configuration overrides"
      tags:
        - 'System Tooling'
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/vnd.api+json: { schema: { type: object, properties: { data: { type: object, properties: { type: { type: string, enum: [extension-configurations] }, id: { type: string, enum: [''] }, attributes: { type: object, properties: { values: { type: array, items: { type: string }, minItems: 1 } }, required: [values] } }, required: [type, id, attributes] } }, required: [data] } }
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        422:
          $ref: '#/components/responses/ValidationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
  '/extensions/{id}/enable':
    post:
      operationId: extension.enable
      summary: 'Enable an extension'
      tags:
        - 'System Tooling'
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        401:
          $ref: '#/components/responses/AuthenticationException'
  '/extensions/{id}/disable':
    post:
      operationId: extension.disable
      summary: 'Disable an extension'
      tags:
        - 'System Tooling'
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        401:
          $ref: '#/components/responses/AuthenticationException'
  /extensions/install:
    post:
      operationId: extensionInstall.install
      summary: 'Install a new extension from an uploaded zip package'
      tags:
        - 'System Tooling'
      requestBody:
        required: true
        content:
          multipart/form-data: { schema: { type: object, properties: { package: { type: string, format: binary, contentMediaType: application/octet-stream, description: 'Maximum file size: 20480 kilobytes.' } }, required: [package] } }
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        422:
          $ref: '#/components/responses/ValidationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
  '/extensions/{id}/update':
    post:
      operationId: extensionInstall.update
      summary: 'Update an existing extension from an uploaded zip package'
      tags:
        - 'System Tooling'
      parameters:
        -
          name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data: { schema: { type: object, properties: { package: { type: string, format: binary, contentMediaType: application/octet-stream, description: 'Maximum file size: 20480 kilobytes.' } }, required: [package] } }
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        422:
          $ref: '#/components/responses/ValidationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
  /system/logs:
    get:
      operationId: log.index
      summary: 'List available log files'
      tags:
        - 'System Tooling'
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        401:
          $ref: '#/components/responses/AuthenticationException'
  '/system/logs/{filename}':
    get:
      operationId: log.show
      summary: 'Display parsed, filterable, paginated entries from a log file'
      tags:
        - 'System Tooling'
      parameters:
        -
          name: filename
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        401:
          $ref: '#/components/responses/AuthenticationException'
  /system/cache:
    get:
      operationId: redis.index
      summary: 'List keys matching an optional pattern, with type and TTL'
      tags:
        - 'System Tooling'
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        401:
          $ref: '#/components/responses/AuthenticationException'
    delete:
      operationId: redis.flush
      description: "Deliberately separate from destroy() and behind its own\npermission (system.cache.clear), since this is destructive\nand irreversible across the whole cache, not a single key."
      summary: 'Flush the entire current Redis database'
      tags:
        - 'System Tooling'
      responses:
        204:
          description: 'No content'
        401:
          $ref: '#/components/responses/AuthenticationException'
  '/system/cache/{key}':
    get:
      operationId: redis.show
      summary: 'Display the value stored under a specific key'
      tags:
        - 'System Tooling'
      parameters:
        -
          name: key
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        401:
          $ref: '#/components/responses/AuthenticationException'
    delete:
      operationId: redis.destroy
      summary: 'Delete a single key'
      tags:
        - 'System Tooling'
      parameters:
        -
          name: key
          in: path
          required: true
          schema: { type: string }
      responses:
        204:
          description: 'No content'
        401:
          $ref: '#/components/responses/AuthenticationException'
  /system/database/tables:
    get:
      operationId: database.tables
      summary: 'List tables in the database'
      tags:
        - 'System Tooling'
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        401:
          $ref: '#/components/responses/AuthenticationException'
  '/system/database/tables/{table}/columns':
    get:
      operationId: database.columns
      summary: "Display a table's columns"
      tags:
        - 'System Tooling'
      parameters:
        -
          name: table
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        401:
          $ref: '#/components/responses/AuthenticationException'
  '/system/database/tables/{table}/preview':
    get:
      operationId: database.preview
      summary: "Preview a table's rows (paginated), with sensitive columns redacted"
      tags:
        - 'System Tooling'
      parameters:
        -
          name: table
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        401:
          $ref: '#/components/responses/AuthenticationException'
  /system/database/query:
    post:
      operationId: database.query
      summary: 'Execute an ad-hoc, validated, read-only SELECT query'
      tags:
        - 'System Tooling'
      requestBody:
        required: true
        content:
          application/vnd.api+json: { schema: { type: object, properties: { data: { type: object, properties: { type: { type: string, enum: [sql-queries] }, attributes: { type: object, properties: { sql: { type: string, maxLength: 5000 } }, required: [sql] } }, required: [type, attributes] } }, required: [data] } }
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        422:
          $ref: '#/components/responses/ValidationException'
        401:
          $ref: '#/components/responses/AuthenticationException'
  /translation-modules:
    get:
      operationId: v1.translation-modules.index
      summary: 'List translatable modules and, per module, their available locales/groups'
      tags:
        - 'System Tooling'
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
  /translation-groups:
    get:
      operationId: v1.translation-groups.index
      summary: 'List translatable modules and, per module, their available locales/groups'
      tags:
        - 'System Tooling'
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
  '/translation-groups/{translation_group}':
    patch:
      operationId: v1.translation-groups.update
      summary: 'Save all translation entries for one group/locale in one request'
      tags:
        - 'System Tooling'
      parameters:
        -
          name: translation_group
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/vnd.api+json: { schema: { $ref: '#/components/schemas/TranslationGroupRequest' } }
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
        422:
          $ref: '#/components/responses/ValidationException'
  /translation-strings:
    get:
      operationId: v1.translation-strings.index
      summary: 'List translatable modules and, per module, their available locales/groups'
      tags:
        - 'System Tooling'
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        404:
          $ref: '#/components/responses/ModelNotFoundException'
        401:
          $ref: '#/components/responses/AuthenticationException'
  /cinema-movie:
    get:
      operationId: cinemaMovie.index
      summary: 'List cinema movies (starter endpoint)'
      tags:
        - CinemaMovie
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        401:
          $ref: '#/components/responses/AuthenticationException'
  /tuleap/ping:
    get:
      operationId: tuleap.ping
      summary: 'Check connectivity to the configured Tuleap instance'
      tags:
        - Tuleap
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        401:
          $ref: '#/components/responses/AuthenticationException'
  /tuleap/projects:
    get:
      operationId: tuleap.getProjects
      summary: 'List Tuleap projects visible to the configured token (cached)'
      tags:
        - Tuleap
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { anyOf: [{ type: string }, { type: object }] } } }
        401:
          $ref: '#/components/responses/AuthenticationException'
  '/tuleap/projects/{projectId}':
    get:
      operationId: tuleap.getProject
      summary: 'Get a single Tuleap project by its Tuleap identifier'
      tags:
        - Tuleap
      parameters:
        -
          name: projectId
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { anyOf: [{ type: string }, { type: object }] } } }
        401:
          $ref: '#/components/responses/AuthenticationException'
  '/tuleap/projects/{projectId}/members':
    get:
      operationId: tuleap.getProjectMembers
      summary: 'List members of a Tuleap project'
      tags:
        - Tuleap
      parameters:
        -
          name: projectId
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { anyOf: [{ type: string }, { type: object }] } } }
        401:
          $ref: '#/components/responses/AuthenticationException'
  '/tuleap/projects/{projectId}/milestones':
    get:
      operationId: tuleap.getMilestones
      summary: 'List milestones of a Tuleap project'
      tags:
        - Tuleap
      parameters:
        -
          name: projectId
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { anyOf: [{ type: string }, { type: object }] } } }
        401:
          $ref: '#/components/responses/AuthenticationException'
  '/tuleap/milestones/{milestoneId}/stats':
    get:
      operationId: tuleap.getStats
      summary: 'Get quality/alert stats for a Tuleap milestone (stale, no points, etc.)'
      tags:
        - Tuleap
      parameters:
        -
          name: milestoneId
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { anyOf: [{ type: string }, { type: object }] } } }
        401:
          $ref: '#/components/responses/AuthenticationException'
  '/tuleap/milestones/{milestoneId}/burndown':
    get:
      operationId: tuleap.getBurndown
      summary: 'Get the burndown series for a Tuleap milestone'
      tags:
        - Tuleap
      parameters:
        -
          name: milestoneId
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { anyOf: [{ type: string }, { type: object }] } } }
        401:
          $ref: '#/components/responses/AuthenticationException'
  '/tuleap/projects/{projectId}/sprint-history':
    get:
      operationId: tuleap.getSprintHistory
      summary: 'Get sprint history (predictability, commitment, capacity) for a project'
      tags:
        - Tuleap
      parameters:
        -
          name: projectId
          in: path
          required: true
          schema: { type: integer }
        -
          name: force
          in: query
          schema: { type: boolean, default: false }
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { anyOf: [{ type: string }, { type: object }] } } }
        401:
          $ref: '#/components/responses/AuthenticationException'
  '/sprint/config/{sprintId}':
    get:
      operationId: sprint.getConfig
      summary: "Get a sprint's configuration (objective, confidence index, capacity distribution)"
      tags:
        - Tuleap
      parameters:
        -
          name: sprintId
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: ''
          content: { application/vnd.api+json: { schema: { type: string } } }
        401:
          $ref: '#/components/responses/AuthenticationException'
    put:
      operationId: sprint.saveConfig
      summary: "Update a sprint's configuration (objective, CAF distribution, velocity)"
