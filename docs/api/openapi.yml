components:
  schemas:
    PlatformSettingRequest:
      type: object
      properties:
        site_name:
          type: string
          maxLength: 255
        locale:
          type: string
          enum: [en, fr]
      title: PlatformSettingRequest
    TranslationGroupRequest:
      type: object
      properties:
        locale:
          type: string
          maxLength: 35
        translations:
          type: array
          items: { type: string }
          minItems: 1
      required:
        - locale
        - translations
      title: TranslationGroupRequest
    UserSettingRequest:
      type: object
      properties:
        locale:
          type: [string, 'null']
          enum: [en, fr, null]
        theme:
          type: string
          enum: [system, light, dark]
        density:
          type: string
          enum: [default, comfortable, compact]
        email_notifications:
          type: boolean
      title: UserSettingRequest
  responses:
    ValidationException:
      description: 'Validation error'
      content:
        application/vnd.api+json:
          schema: { type: object, properties: { message: { type: string, description: 'Errors overview.' }, errors: { type: object, description: 'A detailed description of each field that failed validation.', additionalProperties: { type: array, items: { type: string } } } }, required: [message, errors] }
    AuthenticationException:
      description: Unauthenticated
      content:
        application/vnd.api+json:
          schema: { type: object, properties: { message: { type: string, description: 'Error overview.' } }, required: [message] }
    AuthorizationException:
      description: 'Authorization error'
      content:
        application/vnd.api+json:
          schema: { type: object, properties: { message: { type: string, description: 'Error overview.' } }, required: [message] }
    ModelNotFoundException:
      description: 'Not found'
      content:
        application/vnd.api+json:
          schema: { type: object, properties: { message: { type: string, description: 'Error overview.' } }, required: [message] }
