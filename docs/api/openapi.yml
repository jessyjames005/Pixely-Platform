openapi: 3.0.3
info:
  title: 'Pixely Platform API'
  description: 'Public API for Pixely Platform extensions.'
  version: 0.1.0
servers:
  -
    url: /
paths:
  /api/v1/gallery:
    get:
      tags:
        - Gallery
      summary: 'List gallery photos'
      description: 'Display gallery photos.'
      operationId: listGalleryPhotos
      parameters:
        -
          name: page
          in: query
          required: false
          description: 'Page number.'
          schema:
            type: integer
            minimum: 1
            default: 1
        -
          name: per_page
          in: query
          required: false
          description: 'Number of photos per page. Maximum 100.'
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        200:
          description: 'Paginated gallery photos.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoListResponse'
  /api/v1/gallery/upload:
    post:
      tags:
        - Gallery
      summary: 'Upload a gallery photo'
      description: 'Upload a new gallery photo.'
      operationId: uploadGalleryPhoto
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                title:
                  type: string
                  nullable: true
                  maxLength: 255
                  description: 'Optional photo title.'
                image:
                  type: string
                  format: binary
                  description: 'Image file.'
      responses:
        201:
          description: 'Gallery photo created.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoResponse'
        422:
          description: 'Validation error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  '/api/v1/gallery/{photo}':
    get:
      tags:
        - Gallery
      summary: 'Get a gallery photo'
      description: 'Display a single gallery photo.'
      operationId: getGalleryPhoto
      parameters:
        -
          name: photo
          in: path
          required: true
          description: 'Photo identifier.'
          schema:
            type: integer
            example: 1
      responses:
        200:
          description: 'Gallery photo.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoResponse'
        404:
          description: 'Photo not found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      tags:
        - Gallery
      summary: 'Update a gallery photo'
      description: 'Update a gallery photo title.'
      operationId: updateGalleryPhoto
      parameters:
        -
          name: photo
          in: path
          required: true
          description: 'Photo identifier.'
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 255
                  description: 'Photo title.'
      responses:
        200:
          description: 'Gallery photo updated.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoResponse'
        404:
          description: 'Photo not found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        422:
          description: 'Validation error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags:
        - Gallery
      summary: 'Delete a gallery photo'
      description: 'Delete a gallery photo and its stored image.'
      operationId: deleteGalleryPhoto
      parameters:
        -
          name: photo
          in: path
          required: true
          description: 'Photo identifier.'
          schema:
            type: integer
            example: 1
      responses:
        204:
          description: 'Gallery photo deleted.'
        404:
          description: 'Photo not found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
tags:
  -
    name: Gallery
    description: 'Gallery photo management.'
components:
  schemas:
    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: RESOURCE_NOT_FOUND
            message:
              type: string
              example: 'The requested resource was not found.'
            details:
              type: object
              nullable: true
              additionalProperties: true
    PaginationMeta:
      type: object
      required:
        - current_page
        - last_page
        - per_page
        - total
      properties:
        current_page:
          type: integer
          example: 1
        last_page:
          type: integer
          example: 5
        per_page:
          type: integer
          example: 20
        total:
          type: integer
          example: 95
    Photo:
      type: object
      required:
        - id
        - title
        - filename
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          nullable: true
          example: Sunset
        filename:
          type: string
          example: gallery/sunset.jpg
    PhotoResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Photo'
    PhotoListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
