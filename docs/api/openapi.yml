openapi: 3.0.0
info:
  title: 'Pixely Platform API'
  description: 'Public API for Pixely Platform extensions.'
  version: 0.1.0
servers:
  -
    url: /
paths:
  /api/v1/gallery:
    get:
      tags:
        - Gallery
      summary: 'List gallery photos'
      description: 'Display gallery photos.'
      operationId: listGalleryPhotos
      parameters:
        -
          name: page
          in: query
          description: 'Page number.'
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        -
          name: per_page
          in: query
          description: 'Number of photos per page. Maximum 100.'
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
            minimum: 1
      responses:
        '200':
          description: 'Paginated gallery photos.'
  '/api/v1/gallery/{photo}':
    get:
      tags:
        - Gallery
      summary: 'Get a gallery photo'
      description: 'Display a single gallery photo.'
      operationId: getGalleryPhoto
      parameters:
        -
          name: photo
          in: path
          description: 'Photo identifier.'
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: 'Gallery photo.'
        '404':
          description: 'Photo not found.'
tags:
  -
    name: Gallery
    description: 'Gallery photo management.'

