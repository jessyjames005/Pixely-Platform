services:
  mysql-e2e:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: pixely_e2e
      MYSQL_USER: pixely_e2e
      MYSQL_PASSWORD: ${E2E_DB_PASSWORD:?Set E2E_DB_PASSWORD in .env.e2e}
      MYSQL_ROOT_PASSWORD: ${E2E_DB_ROOT_PASSWORD:?Set E2E_DB_ROOT_PASSWORD in .env.e2e}
    ports:
      - "3307:3306"
    volumes:
      - pixely_e2e_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - pixely-e2e

  redis-e2e:
    image: redis:alpine
    ports:
      - "6380:6379"
    networks:
      - pixely-e2e

  app-e2e:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www
    volumes:
      - ./:/var/www
    env_file:
      - .env.e2e
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql-e2e
      DB_PORT: 3306
      DB_DATABASE: pixely_e2e
      DB_USERNAME: pixely_e2e
      DB_PASSWORD: ${E2E_DB_PASSWORD:?Set E2E_DB_PASSWORD in .env.e2e}
      REDIS_HOST: redis-e2e
      REDIS_PORT: 6379
      APP_URL: http://nginx-e2e
      SANCTUM_STATEFUL_DOMAINS: nginx-e2e,127.0.0.1:8082,localhost:8082
    depends_on:
      mysql-e2e:
        condition: service_healthy
      redis-e2e:
        condition: service_started
    networks:
      - pixely-e2e

  nginx-e2e:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./:/var/www:ro
      - ./docker/nginx/e2e.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-e2e
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/up"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - pixely-e2e

  playwright:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /var/www
    init: true
    command: ["bash", "-lc", "npm ci && npm run build && npm run test:e2e"]
    environment:
      E2E_BASE_URL: http://nginx-e2e
      E2E_USER_EMAIL: admin@pixely.test
      E2E_USER_PASSWORD: ${E2E_PASSWORD:?Set E2E_PASSWORD in .env.e2e}
    depends_on:
      nginx-e2e:
        condition: service_healthy
    volumes:
      - ./:/var/www
      - e2e_node_modules:/var/www/node_modules
    networks:
      - pixely-e2e

volumes:
  pixely_e2e_mysql:
  e2e_node_modules:

networks:
  pixely-e2e:
    name: pixely-e2e
