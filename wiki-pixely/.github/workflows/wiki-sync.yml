name: Wiki sync

# Publishes the generated wiki (scripts/build-wiki.py) to the GitHub wiki.
# Manual by default. Set the repository variable WIKI_SYNC to 'true' to also
# publish on every push to develop that touches the documentation.
# Prerequisite: the wiki is enabled and its first page has been created once.

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'docs/**'
      - 'VISION.md'
      - 'ARCHITECTURE.md'
      - 'ROADMAP.md'
      - 'CHANGELOG.md'
      - 'scripts/build-wiki.py'

permissions:
  contents: write

jobs:
  wiki:
    name: Publish wiki
    if: ${{ github.event_name == 'workflow_dispatch' || vars.WIKI_SYNC == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build wiki pages
        run: python3 scripts/build-wiki.py build/wiki

      - name: Publish to the wiki repository
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki-repo
          rsync -a --delete --exclude .git build/wiki/ wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
          else
            git commit -m "Sync wiki from docs (${GITHUB_SHA::7})"
            git push
          fi
