name: Pixely CI

on:
  push:
    branches:
      - feature/bootstrap-laravel
  pull_request:
    branches:
      - feature/bootstrap-laravel
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Laravel tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: pixely
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: pixely
          MYSQL_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check PHP
        run: |
          php --version
          php -m

      - name: Validate Composer
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Configure MySQL read-only user
        run: |
          mysql \
            --host=127.0.0.1 \
            --port=3306 \
            --user=root \
            --password=root \
            -e "
              CREATE USER IF NOT EXISTS 'pixely_readonly'@'%' IDENTIFIED BY 'readonly_password';
              GRANT SELECT ON pixely.* TO 'pixely_readonly'@'%';
              FLUSH PRIVILEGES;
            "

      - name: Configure database environment
        run: |
          echo "DB_READONLY_DATABASE=pixely" >> "$GITHUB_ENV"
          echo "DB_READONLY_USERNAME=pixely_readonly" >> "$GITHUB_ENV"
          echo "DB_READONLY_PASSWORD=readonly_password" >> "$GITHUB_ENV"

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test
