name: Pixely CI

on:
  push:
    branches:
      - develop
      - feature/bootstrap-laravel
  pull_request:
    branches:
      - develop
      - feature/bootstrap-laravel
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the running one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security audits and secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Audit PHP dependencies
        run: composer security:audit:back

      - name: Set up Node.js
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Audit frontend dependencies
        if: ${{ !cancelled() }}
        run: npm run security:audit:front

      - name: Scan for leaked secrets
        if: ${{ !cancelled() }}
        uses: trufflesecurity/trufflehog@v3.97.9
        with:
          version: 3.97.9
          path: ./
          extra_args: --results=verified,unknown

  build-back:
    name: Build backend
    needs: security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build backend
        run: composer build:back

  build-front:
    name: Build frontend
    needs: security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:front

  build-fresh-install:
    name: Build fresh install
    needs: [build-back, build-front]
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: pixely
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: pixely
          MYSQL_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pixely
      DB_USERNAME: pixely
      DB_PASSWORD: root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_mysql, redis
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          sed -i 's|^DB_CONNECTION=.*|DB_CONNECTION=mysql|' .env
          sed -i 's|^# DB_HOST=.*|DB_HOST=127.0.0.1|' .env
          sed -i 's|^# DB_PORT=.*|DB_PORT=3306|' .env
          sed -i 's|^# DB_DATABASE=.*|DB_DATABASE=pixely|' .env
          sed -i 's|^# DB_USERNAME=.*|DB_USERNAME=pixely|' .env
          sed -i 's|^# DB_PASSWORD=.*|DB_PASSWORD=root|' .env
          php artisan key:generate

      - name: Run migrations and seed database
        run: |
          php artisan migrate --force
          php artisan db:seed --force

      - name: Build backend
        run: composer build:back

      - name: Build frontend
        run: npm run build:front

  php-lint:
    name: PHP syntax lint
    needs: [build-back, build-front, build-fresh-install]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Check PHP syntax
        run: find app bootstrap config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  phpstan:
    name: PHPStan analysis
    needs: [build-back, build-front, build-fresh-install]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan
        run: composer phpstan

  php-code-style:
    name: PHP code style
    needs: [build-back, build-front, build-fresh-install]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Errors fail the job; warnings (e.g. the soft 120-column limit) are
      # reported but do not (see ignore_warnings_on_exit in phpcs.xml).
      - name: Check coding standard
        run: composer cs:check

  frontend-quality:
    name: Frontend quality checks
    needs: [build-back, build-front, build-fresh-install]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Stylelint
        run: npm run stylelint

      - name: Run Vitest
        run: npm test
        env:
          LARAVEL_BYPASS_ENV_CHECK: '1'

  backend-unit:
    name: Backend unit tests
    needs: [build-back, build-front, build-fresh-install]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: pcov

      - name: Check PHP
        run: |
          php --version
          php -m

      - name: Validate Composer
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run unit tests
        shell: bash
        run: |
          test_paths=(tests/Unit)
          while IFS= read -r -d '' extension_tests; do
            test_paths+=("$extension_tests")
          done < <(find app/Extensions -type d -path '*/tests/Unit' -print0 2>/dev/null)

          mkdir -p build/coverage
          php artisan test "${test_paths[@]}" --coverage-clover=build/coverage/unit.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: php-coverage-unit
          path: build/coverage/unit.xml
          if-no-files-found: error
          retention-days: 7

  backend-functional:
    name: Backend functional tests
    needs: [build-back, build-front, build-fresh-install]
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: pixely
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: pixely
          MYSQL_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_mysql, redis
          coverage: pcov

      - name: Check PHP
        run: |
          php --version
          php -m

      - name: Validate Composer
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Configure MySQL read-only user
        run: |
          mysql \
            --host=127.0.0.1 \
            --port=3306 \
            --user=root \
            --password=root \
            -e "
              CREATE USER IF NOT EXISTS 'pixely_readonly'@'%' IDENTIFIED BY 'readonly_password';
              GRANT SELECT ON pixely.* TO 'pixely_readonly'@'%';
              FLUSH PRIVILEGES;
            "

      - name: Configure database environment
        run: |
          echo "DB_READONLY_DATABASE=pixely" >> "$GITHUB_ENV"
          echo "DB_READONLY_USERNAME=pixely_readonly" >> "$GITHUB_ENV"
          echo "DB_READONLY_PASSWORD=readonly_password" >> "$GITHUB_ENV"

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run functional tests
        shell: bash
        run: |
          test_paths=(tests/Feature)
          while IFS= read -r -d '' extension_tests; do
            test_paths+=("$extension_tests")
          done < <(find app/Extensions -type d -path '*/tests/Functional' -print0 2>/dev/null)

          mkdir -p build/coverage
          php artisan test "${test_paths[@]}" --coverage-clover=build/coverage/functional.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: php-coverage-functional
          path: build/coverage/functional.xml
          if-no-files-found: error
          retention-days: 7

  coverage-gate:
    name: PHP coverage gate
    needs: [backend-unit, backend-functional]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test the gate script
        run: node --test scripts/*.test.mjs

      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          pattern: php-coverage-*
          path: build/coverage
          merge-multiple: true

      # The unit and functional jobs each see part of the code, so their
      # reports are merged before the minimum is applied. Set the repository
      # variable PHP_COVERAGE_MIN (0-100) to override the 80% default; 0
      # reports without failing, which is how to measure a baseline.
      - name: Enforce minimum coverage
        run: node scripts/coverage-gate.mjs build/coverage --min=${{ vars.PHP_COVERAGE_MIN || '10' }}


  frontend-e2e:
    name: Frontend end-to-end tests
    needs: [build-back, build-front, build-fresh-install]
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: pixely
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: pixely
          MYSQL_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_DEBUG: 'false'
      DEBUGBAR_ENABLED: 'false'
      APP_URL: http://127.0.0.1:8000
      SANCTUM_STATEFUL_DOMAINS: 127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pixely
      DB_USERNAME: pixely
      DB_PASSWORD: root
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      E2E_BASE_URL: http://127.0.0.1:8000
      E2E_USER_EMAIL: test@example.com
      E2E_USER_PASSWORD: password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_mysql, redis
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          sed -i 's|^APP_URL=.*|APP_URL=http://127.0.0.1:8000|' .env
          sed -i 's|^DB_CONNECTION=.*|DB_CONNECTION=mysql|' .env
          sed -i 's|^# DB_HOST=.*|DB_HOST=127.0.0.1|' .env
          sed -i 's|^# DB_PORT=.*|DB_PORT=3306|' .env
          sed -i 's|^# DB_DATABASE=.*|DB_DATABASE=pixely|' .env
          sed -i 's|^# DB_USERNAME=.*|DB_USERNAME=pixely|' .env
          sed -i 's|^# DB_PASSWORD=.*|DB_PASSWORD=root|' .env
          echo "SANCTUM_STATEFUL_DOMAINS=127.0.0.1:8000" >> .env
          sed -i 's|^REDIS_HOST=.*|REDIS_HOST=127.0.0.1|' .env
          php artisan key:generate

      - name: Run migrations and seed test account
        run: |
          php artisan migrate --force
          php artisan db:seed --force

      - name: Build frontend
        run: npm run build

      - name: Start Laravel server
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/pixely-e2e-server.log 2>&1 &
          echo $! > /tmp/pixely-e2e-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/pixely-e2e-server.log
          exit 1

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e

  production-quality:
    name: Production quality gate
    needs: [php-lint, phpstan, php-code-style, frontend-quality, backend-unit, backend-functional, coverage-gate, frontend-e2e]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install production PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Optimize production backend
        run: composer build:back
        env:
          APP_ENV: production
          APP_DEBUG: 'false'

      - name: Install Node dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build:front
